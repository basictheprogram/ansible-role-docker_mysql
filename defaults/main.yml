---
# MySQL version — maps directly to the Docker Hub tag.
mysql_docker_version: "8.4"

# Image repository (allows override for mirrors/private registries later).
mysql_docker_image: "mysql"

# Container naming.
mysql_docker_container_name: "mysql-{{ mysql_docker_version }}"

# Networking. mysql_docker_host is informational (not passed to the
# container — the image has no "host" env var); it documents/exposes where
# downstream consumers should connect. Override in host_vars for non-default
# topologies (e.g. a reverse proxy or non-localhost Docker host).
mysql_docker_host: "localhost"
mysql_docker_host_port: 3306
mysql_docker_container_port: 3306

# Auth / root credentials. No default on purpose — set this via a
# vault-encrypted host_vars variable, e.g. host_vars/<host>/vault.yml:
#   mysql_docker_root_password: !vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     ...
# The preflight check (tasks/preflight.yml) fails fast if it's still blank.
mysql_docker_root_password: ""

# Optional additional MySQL user, passed through to the image's MYSQL_USER/
# MYSQL_PASSWORD env vars. Both must be set together (or both left blank,
# the default) — set via host_vars, same as the root password. This is
# opt-in: the role still doesn't provision application databases/schemas,
# it only creates the user if you ask for one. See DESIGN.md, Section 3.
mysql_docker_user: ""
mysql_docker_password: ""

# Charset/auth defaults (minimal config surface — no custom my.cnf in v1).
mysql_docker_character_set: "utf8mb4"
mysql_docker_collation: "utf8mb4_unicode_ci"
# Use "mysql_native_password" instead if legacy app compatibility is needed.
mysql_docker_default_authentication_plugin: "caching_sha2_password"

# Volume. Wiped and recreated on every run (see mysql_docker_wipe_volume).
mysql_docker_volume_name: "{{ mysql_docker_container_name }}-data"

# Lifecycle. This role always destroys/recreates the container and wipes the
# volume — it is designed for ephemeral testing/CI use, not persistent data.
mysql_docker_restart_policy: "unless-stopped"
mysql_docker_recreate: true
mysql_docker_wipe_volume: true

# Readiness. How long to wait for the container's built-in HEALTHCHECK
# (mysqladmin ping) to report healthy before failing the role.
# mysql_docker_healthcheck_retries and mysql_docker_healthcheck_interval
# are the actual retry/delay used by the wait task; mysql_docker_startup_timeout
# is the approximate total (retries * interval) shown in the failure
# message — it's derived by default but can be overridden independently.
#
# The default budget is generous (10 minutes) because this role always
# wipes the volume and reinitializes MySQL from scratch on every run, and
# real-world --initialize time varies far more than you'd expect: two
# consecutive runs on the same host were observed taking ~34s and ~239s
# respectively (disk I/O contention, not a role bug). A short default
# here just means spurious failures on a loaded or slow-storage host —
# only tighten it if you've confirmed your host's actual init time is
# reliably fast.
mysql_docker_healthcheck_retries: 120
mysql_docker_healthcheck_interval: 5
mysql_docker_startup_timeout: "{{ (mysql_docker_healthcheck_retries | int) * (mysql_docker_healthcheck_interval | int) }}"
