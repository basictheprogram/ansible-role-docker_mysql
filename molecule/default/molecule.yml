---
driver:
  name: docker

platforms:
  - name: instance-ubuntu2204
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    command: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    pre_build_image: true
  - name: instance-ubuntu2404
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    command: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    pre_build_image: true
  - name: instance-debian12
    image: "geerlingguy/docker-debian12-ansible:latest"
    command: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    pre_build_image: true
  - name: instance-debian13
    image: "geerlingguy/docker-debian13-ansible:latest"
    command: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  inventory:
    # mysql_docker_root_password has no default (see defaults/main.yml) and
    # is normally supplied via a vault-encrypted host_vars variable. This
    # scenario isn't a real deployment, so it's set here in plaintext as a
    # disposable test fixture, not a real secret - matches
    # tests/_data.py's MYSQL_ROOT_PASSWORD constant.
    host_vars:
      instance-ubuntu2204:
        mysql_docker_version: "8.4"
        mysql_docker_root_password: "root" # ephemeral test fixture, not a real secret
      instance-ubuntu2404:
        mysql_docker_version: "8.4"
        mysql_docker_root_password: "root" # ephemeral test fixture, not a real secret
      instance-debian12:
        mysql_docker_version: "8.4"
        mysql_docker_root_password: "root" # ephemeral test fixture, not a real secret
      instance-debian13:
        mysql_docker_version: "8.4"
        mysql_docker_root_password: "root" # ephemeral test fixture, not a real secret

verifier:
  name: testinfra
  directory: tests/
  options:
    v: true
    p: "no:cacheprovider"

# This role intentionally destroys/recreates the container and wipes the
# volume on every run (see DESIGN.md, Section 3 and 6), so a standard
# "idempotence" check (second run = no changes) does not apply. It is
# deliberately omitted from the test sequence below.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
